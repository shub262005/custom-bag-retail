spring.application.name=inventory-management-test
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_management
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
app.jwt.secret=test-only-jwt-secret-with-at-least-thirty-two-bytes
app.jwt.access-token-ttl=PT8H
