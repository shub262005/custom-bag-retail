# Server Configuration
server.port=8080

# Application Name
spring.application.name=inventory-management

# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration (Validation Mode)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial baseline

# Authentication (override JWT_SECRET outside local development)
app.jwt.secret=${JWT_SECRET:local-development-only-jwt-secret-change-before-production-2026}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT8H}

# Custom Bag logo uploads (development filesystem; use object storage in production)
app.upload.custom-bag-logo-dir=${CUSTOM_BAG_LOGO_DIR:uploads/custom-bag-logos}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
